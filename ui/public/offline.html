<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <title>Factory Console · sin conexión</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #07090c;
        color: #e6edf3;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        border: 1px solid #222a38;
        border-radius: 16px;
        padding: 28px 24px;
        background: #0b0e13;
      }
      .logo {
        width: 44px;
        height: 44px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(124, 92, 255, 0.4);
        border-radius: 10px;
        background: rgba(124, 92, 255, 0.15);
        color: #a78bfa;
        font-weight: 700;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { color: #8b949e; font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
      button {
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        border: 1px solid rgba(124, 92, 255, 0.6);
        background: #7c5cff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">F</div>
      <h1>Sin conexión</h1>
      <p>
        No se pudo contactar con la consola. Si estás fuera de casa, comprueba que
        Tailscale esté conectado y que el equipo siga encendido.
      </p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
